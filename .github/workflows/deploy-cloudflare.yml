name: Deploy Plazo to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plazo-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: Build Vite production bundle
        run: npm run build
      - name: Check account and find or create isolated Plazo project
        id: project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '9b667cd94f6eaf21a5cc5dd13f0b51c8' }}
        run: node scripts/cloudflare-project.mjs
      - name: Deploy compiled assets to main
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '9b667cd94f6eaf21a5cc5dd13f0b51c8' }}
          command: pages deploy dist --project-name=plazo-app --branch=main
      - name: Verify real public URL and compiled assets
        env:
          PLAZO_PUBLIC_URL: ${{ steps.project.outputs.url }}
        run: node scripts/verify-cloudflare.mjs
