name: Plazo tests — legacy + responsive v2
on:
  push:
    branches:
      - chore/plazo-v1-characterization
      - feat/plazo-v2-private-foundation
      - main
      - fix/plazo-mobile-clients
  pull_request:
    paths:
      - 'tests/**'
      - 'v2/**'
      - 'index.html'
      - 'manifest.json'
      - 'sw.js'
      - 'package.json'
      - 'playwright.config.mjs'
      - 'playwright.live.config.mjs'
      - 'vite.config.mjs'
      - 'public/**'
      - '.github/workflows/legacy-characterization.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  characterization:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Run isolated Node tests
        run: npm test

  responsive-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install pinned browser test dependency
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Build Plazo 2.0 production bundle
        run: npm run build
      - name: Install Chromium and OS dependencies
        run: npx playwright install --with-deps chromium
      - name: Test demo desktop and mobile layouts
        run: npm run test:ui
      - name: Test Supabase Auth UI on desktop and mobile
        run: npm run test:live
      - name: Archive authenticated UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plazo-ui-check
          path: test-results/**/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Archive release bundle for Cloudflare Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: plazo-v2-dist
          path: dist/
          if-no-files-found: error
          retention-days: 14
