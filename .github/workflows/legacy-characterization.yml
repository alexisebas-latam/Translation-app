name: Plazo tests — legacy + responsive v2
on:
  push:
    branches:
      - chore/plazo-v1-characterization
      - feat/plazo-v2-private-foundation
  pull_request:
    paths:
      - 'tests/**'
      - 'v2/**'
      - 'index.html'
      - 'manifest.json'
      - 'sw.js'
      - 'package.json'
      - 'playwright.config.mjs'
      - '.github/workflows/legacy-characterization.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  characterization:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Run isolated Node tests
        run: npm test

  responsive-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install pinned browser test dependency
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Install Chromium and OS dependencies
        run: npx playwright install --with-deps chromium
      - name: Test desktop and mobile layouts
        run: npm run test:ui
