name: Plazo 1.x characterization
on:
  push:
    branches:
      - chore/plazo-v1-characterization
  pull_request:
    paths:
      - 'tests/**'
      - 'index.html'
      - 'manifest.json'
      - 'sw.js'
      - 'package.json'
      - '.github/workflows/legacy-characterization.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-characterization:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Run dependency-free characterization tests
        run: npm test
