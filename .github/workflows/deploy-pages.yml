name: Deploy Plazo 2.0 to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: plazo-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Run unit tests
        run: npm test

      - name: Build GitHub Pages bundle with project base path
        run: npm run build -- --base=/Translation-app/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload compiled site (not source code)
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

      - name: Deploy compiled site
        id: deployment
        uses: actions/deploy-pages@v4
